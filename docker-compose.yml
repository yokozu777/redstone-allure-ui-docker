services:
  allure-api:
    build:
      context: ./allure-api
      dockerfile: docker-custom/Dockerfile.bionic-custom
      args:
        BUILD_DATE: na
        BUILD_VERSION: na
        BUILD_REF: na
        ALLURE_RELEASE: 2.27.0
    environment:
      CHECK_RESULTS_EVERY_SECONDS: NONE
      KEEP_HISTORY: 1
      KEEP_HISTORY_LATEST: 25
    ports:
      - "5050:5050"
    volumes:
      - ./projects:/app/projects
    container_name: allure-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/allure-docker-service/version"]
      interval: 30s
      timeout: 10s
      retries: 3

  allure-ui:
    build:
      context: ./allure-fork
      dockerfile: docker/Dockerfile
      args:
        VERSION: na
        VCS_REF: na
        BUILD_DATE: na
    environment:
      ALLURE_DOCKER_PUBLIC_API_URL: "http://localhost:5050"
      ALLURE_DOCKER_PUBLIC_API_URL_PREFIX: ""
    ports:
      - "5252:5252"
    depends_on:
      allure-api:
        condition: service_healthy
    container_name: allure-ui
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5252/allure-docker-service-ui"]
      interval: 30s
      timeout: 10s
      retries: 3